<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#f6f7f8" />
    <title>一人食 · 食材保鲜记录</title>
    <link rel="stylesheet" href="style.css?v=20261026-2" />
    <script defer src="icons.js?v=20261026-1"></script>
    <script defer src="core.js?v=20261026-2"></script>
    <script defer src="app.js?v=20261026-2"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="appbar">
        <a class="brand" href="./" aria-label="一人食首页">
          <span class="brand-mark"><i data-lucide="sprout"></i></span>
          <span><strong>一人食</strong><small>食材保鲜记录</small></span>
        </a>
        <div class="header-actions">
          <span id="current-date" class="current-date"></span>
          <button
            type="button"
            class="icon-button"
            id="export-button"
            title="导出备份"
            aria-label="导出备份"
          >
            <i data-lucide="download"></i>
          </button>
          <button
            type="button"
            class="icon-button"
            id="import-button"
            title="导入备份"
            aria-label="导入备份"
          >
            <i data-lucide="upload"></i>
          </button>
          <input
            type="file"
            id="import-file"
            accept=".json,application/json"
            hidden
          />
        </div>
      </header>

      <main>
        <div class="page-heading">
          <div>
            <span class="eyebrow">MY FOOD JOURNAL</span>
            <h1>食材保鲜记录</h1>
            <p>每一笔采购，都记得；每一份新鲜，都有数。</p>
          </div>
          <button class="primary-button" id="add-button" type="button">
            <i data-lucide="plus"></i><span>记一笔采购</span>
          </button>
        </div>

        <p id="storage-error" class="error-banner" role="alert" hidden></p>

        <section class="summary" aria-label="食材概况">
          <button type="button" class="stat stat-inventory" data-filter="all">
            <span><i data-lucide="refrigerator"></i>在库食材</span
            ><strong id="stat-total">0<small>项</small></strong
            ><span class="stat-foot">每一份都好好安排</span>
          </button>
          <button type="button" class="stat stat-soon" data-filter="soon">
            <span><i data-lucide="timer"></i>3 天内到期</span
            ><strong id="stat-soon">0<small>项</small></strong
            ><span class="stat-foot">今天起，优先吃这些</span>
          </button>
          <button type="button" class="stat stat-expired" data-filter="expired">
            <span><i data-lucide="circle-alert"></i>已过记录期限</span
            ><strong id="stat-expired">0<small>项</small></strong
            ><span class="stat-foot">单独检查与处理</span>
          </button>
          <div class="stat stat-spent">
            <span><i data-lucide="receipt-text"></i>累计采购实付</span
            ><strong id="stat-spent">¥0.00</strong
            ><span id="stat-spent-foot" class="stat-foot"
              >按已填写的金额汇总</span
            >
          </div>
        </section>

        <div class="notice" id="missing-notice" hidden>
          <span class="notice-icon"><i data-lucide="calendar-clock"></i></span>
          <div>
            <strong id="missing-title"></strong>
            <p>补上包装到期日或食用截止日，才有准确的倒计时。</p>
          </div>
          <button type="button" id="missing-button">
            去补全<i data-lucide="arrow-up-right"></i>
          </button>
        </div>

        <div class="view-bar">
          <nav class="view-tabs" aria-label="记录视图">
            <button
              type="button"
              data-view="inventory"
              aria-pressed="true"
              class="active"
            >
              <i data-lucide="layout-list"></i>食材库存
              <span id="inventory-count">0</span>
            </button>
            <button type="button" data-view="history" aria-pressed="false">
              <i data-lucide="notebook-pen"></i>购买记录
              <span id="history-count">0</span>
            </button>
          </nav>
          <span class="saved-label" id="saved-label"
            ><span></span>记录保存在当前浏览器</span
          >
        </div>

        <section class="inventory-section" aria-label="食材列表">
          <div class="toolbar">
            <label class="search-field"
              ><i data-lucide="search"></i
              ><input
                id="search"
                type="search"
                placeholder="搜索食材、商店或备注"
                aria-label="搜索食材、商店或备注"
            /></label>
            <div class="toolbar-selects">
              <label
                ><span class="sr-only">保存方式筛选</span
                ><select id="storage-filter">
                  <option value="all">全部保存方式</option>
                  <option value="fridge">冷藏</option>
                  <option value="freezer">冷冻</option>
                  <option value="room">常温</option>
                  <option value="unknown">保存待确认</option>
                </select></label
              >
              <label
                ><span class="sr-only">排序方式</span
                ><select id="sort">
                  <option value="expiry">到期时间优先</option>
                  <option value="purchase">最近购买优先</option>
                  <option value="price">实付金额优先</option>
                  <option value="name">食材名称排序</option>
                </select></label
              >
            </div>
          </div>
          <div class="filter-bar">
            <div class="filters" id="filters" aria-label="食材状态筛选"></div>
            <span
              id="result-count"
              class="result-count"
              aria-live="polite"
            ></span>
          </div>
          <div class="list-heading" aria-hidden="true">
            <span>食材 / 采购明细</span><span>保鲜倒计时</span><span>操作</span>
          </div>
          <div id="food-list"></div>
          <div id="empty-state" class="empty-state" hidden>
            <i data-lucide="shopping-basket"></i>
            <h2 id="empty-title"></h2>
            <p id="empty-description"></p>
            <button type="button" class="secondary-button" id="empty-button">
              清除筛选
            </button>
          </div>
        </section>

        <footer>
          <p>
            <i data-lucide="refresh-cw"></i><span id="refresh-label"></span>
          </p>
          <p>
            按所填日期计算，不能代替食品安全判断。包装说明、实际保存情况及食物异常优先。
          </p>
          <p class="local-note">
            记录保存在当前浏览器，建议定期导出备份；不同设备暂不自动同步。
          </p>
        </footer>
      </main>
    </div>

    <dialog id="food-dialog" aria-labelledby="form-title">
      <form id="food-form">
        <div class="dialog-heading">
          <div>
            <span class="eyebrow">FOOD DETAILS</span>
            <h2 id="form-title">记一笔采购</h2>
          </div>
          <button
            type="button"
            class="icon-button"
            data-close-dialog
            title="关闭"
            aria-label="关闭"
          >
            <i data-lucide="x"></i>
          </button>
        </div>
        <input type="hidden" name="id" />
        <div class="form-fields">
          <label class="full-width"
            >食材名称 <span class="required">*</span
            ><input
              name="name"
              required
              maxlength="120"
              placeholder="例如：鲜牛奶"
          /></label>
          <label
            >分类<select name="category">
              <option value="prepared">速食 / 熟食</option>
              <option value="meat">肉 / 水产</option>
              <option value="vegetable">蔬菜 / 水果</option>
              <option value="dairy">蛋 / 奶</option>
              <option value="dessert">甜点 / 零食</option>
              <option value="staple">米面 / 粮油</option>
              <option value="other">其他</option>
            </select></label
          >
          <label
            >保存方式<select name="storage">
              <option value="unknown">待确认</option>
              <option value="fridge">冷藏</option>
              <option value="freezer">冷冻</option>
              <option value="room">常温</option>
            </select></label
          >
          <label
            >购买规格 / 数量<input
              name="quantity"
              maxlength="160"
              placeholder="例如：250ml × 6 盒"
          /></label>
          <label
            >当前剩余<input
              name="remaining"
              maxlength="120"
              placeholder="例如：还剩 4 盒"
          /></label>
          <label
            >合计实付（元）<input
              name="price"
              type="number"
              min="0"
              max="999999.99"
              step="0.01"
              inputmode="decimal"
              placeholder="未确认可留空"
          /></label>
          <label>购买日期<input name="purchaseDate" type="date" /></label>
          <label class="full-width"
            >购买商店 / 订单<input
              name="shop"
              maxlength="200"
              placeholder="例如：超市名称 / 订单尾号"
          /></label>
        </div>
        <fieldset class="expiry-fields">
          <legend><i data-lucide="calendar-days"></i>保鲜日期</legend>
          <div class="form-fields">
            <label class="full-width"
              >商品保质期<input
                name="shelfLife"
                maxlength="120"
                placeholder="例如：12个月 / 4天，以包装或商家说明为准"
            /></label>
            <label>包装到期日<input name="expiryDate" type="date" /></label>
            <label>开封日期<input name="openedDate" type="date" /></label>
            <label
              >开封后 / 自定截止日<input name="useByDate" type="date"
            /></label>
            <label
              >截止日依据<select name="dateBasis">
                <option value="label">包装 / 商家说明</option>
                <option value="personal">个人计划（非保质期）</option>
              </select></label
            >
          </div>
          <p>
            保质期是商品的保存期限，不是从购买当天起的剩余时间。以两个截止日中较早的日期倒计时，日期当天显示“今天截止”。
          </p>
          <output
            id="deadline-preview"
            class="deadline-preview"
            aria-live="polite"
          ></output>
        </fieldset>
        <label class="notes-label"
          >备注<textarea
            name="notes"
            rows="3"
            maxlength="2000"
            placeholder="品牌、批次、保存要求或其他要记住的事"
          ></textarea>
        </label>
        <p class="form-error" id="form-error" role="alert" hidden></p>
        <div class="dialog-footer">
          <button type="button" class="secondary-button" data-close-dialog>
            取消</button
          ><button type="submit" class="primary-button">
            <i data-lucide="check"></i>保存记录
          </button>
        </div>
      </form>
    </dialog>

    <dialog
      id="confirm-dialog"
      class="small-dialog"
      aria-labelledby="confirm-title"
    >
      <form method="dialog">
        <div class="dialog-heading">
          <h2 id="confirm-title"></h2>
          <button
            class="icon-button"
            value="cancel"
            aria-label="关闭"
            title="关闭"
          >
            <i data-lucide="x"></i>
          </button>
        </div>
        <p id="confirm-description"></p>
        <div class="dialog-footer">
          <button class="secondary-button" value="cancel">取消</button
          ><button class="primary-button" id="confirm-action" value="confirm">
            确认
          </button>
        </div>
      </form>
    </dialog>
    <div id="toast" class="toast" role="status" hidden></div>
    <noscript>请启用 JavaScript，以使用食材记录和日期倒计时。</noscript>
  </body>
</html>
